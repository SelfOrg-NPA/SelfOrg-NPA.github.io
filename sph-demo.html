<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPH Perception Demo</title>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]']],
    },
    svg: { fontCache: 'global' },
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #0a0a0a;
    font-family: 'Google Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .sph-card {
    max-width: 960px;
    margin: 0 auto;
    background: #f7f4ec;
    color: #2a2a2a;
    border-radius: 14px;
    padding: 16px 20px 18px;
    display: grid;
    grid-template-columns: 200px minmax(0, 440px) 240px;
    grid-template-rows: auto 1fr;
    justify-content: center;
    column-gap: 16px;
    row-gap: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  .sph-card h2 {
    margin: 0 0 4px 0;
    font-size: 16px;
    font-weight: 600;
    color: #3a3a3a;
    grid-column: 1 / -1;
    grid-row: 1;
  }
  .sph-card .perception-bar {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
  }
  .sph-card .perception-bar .label {
    font-weight: 600;
    font-size: 13px;
    color: #3a3a3a;
    margin-bottom: 2px;
  }
  .sph-card .perception-bar .chip-group {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .sph-card .perception-bar .chip {
    text-align: left;
    padding: 8px 16px;
    font-size: 13px;
    white-space: nowrap;
  }
  .sph-card .kernels {
    grid-column: 1 / -1;
    grid-row: 4;
    display: flex;
    flex-direction: row;
    gap: 8px;
    margin-top: 4px;
  }
  .sph-card .kernel-block {
    background: #fffdf6;
    border-radius: 8px;
    padding: 4px;
    border: 1px solid #ece4d3;
    flex: 1 1 0;
    min-width: 0;
    position: relative;
  }
  .sph-card .kernel-y-label {
    position: absolute;
    top: 6px;
    left: 22px;
    color: #222;
    pointer-events: none;
    z-index: 2;
  }
  .sph-card .kernel-x-label {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    color: #222;
    pointer-events: none;
    z-index: 2;
  }
  .sph-card .kernel-y-label mjx-container,
  .sph-card .kernel-x-label mjx-container { font-size: 1em; }
  .sph-card .kernel-block .kt {
    font-size: 11px;
    color: #555;
    padding: 2px 4px;
  }
  .sph-card .kernel-block canvas {
    display: block;
    width: 100%;
    height: 150px;
  }
  .sph-card .main {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-width: 0;
  }
  .sph-card .main canvas#main-canvas {
    width: 100%;
    max-width: 440px;
    aspect-ratio: 1;
    background: #fffdf6;
    border-radius: 10px;
    border: 1px solid #ece4d3;
    cursor: grab;
    touch-action: none;
    display: block;
    align-self: center;
  }
  .sph-card .main canvas#main-canvas.dragging { cursor: grabbing; }
  .sph-card .controls-col {
    grid-column: 3;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
  }
  .sph-card details {
    background: #fffdf6;
    border: 1px solid #ece4d3;
    border-radius: 8px;
    padding: 6px 10px 8px;
  }
  .sph-card details > summary {
    cursor: pointer;
    font-weight: 600;
    list-style: none;
    padding: 2px 0;
    color: #3a3a3a;
    user-select: none;
  }
  .sph-card details > summary::-webkit-details-marker { display: none; }
  .sph-card details > summary::before {
    content: "▸";
    display: inline-block;
    width: 14px;
    color: #888;
    transition: transform 0.15s;
  }
  .sph-card details[open] > summary::before { content: "▾"; }
  .sph-card .folder-body {
    padding-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sph-card .slider-row {
    display: grid;
    grid-template-columns: 24px 1fr 42px;
    align-items: center;
    gap: 6px;
  }
  .sph-card .slider-row .nm {
    font-style: italic;
    color: #444;
  }
  .sph-card .slider-row .vl {
    font-variant-numeric: tabular-nums;
    color: #555;
    font-size: 12px;
    text-align: right;
  }
  .sph-card input[type=range] {
    accent-color: #4a8a5c;
    width: 100%;
    margin: 0;
  }
  .sph-card .group-label {
    font-size: 12px;
    color: #666;
    margin-top: 2px;
  }
  .sph-card .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .sph-card .chip {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #d0c8b8;
    background: #fff;
    cursor: pointer;
    font-size: 12px;
    color: #444;
    user-select: none;
    font-family: inherit;
    transition: background 0.1s, color 0.1s;
  }
  .sph-card .chip:hover { background: #f3eedf; }
  .sph-card .chip.active {
    background: #4a8a5c;
    color: #fff;
    border-color: #3a7a4c;
  }
  .sph-card .btn {
    background: #fff;
    border: 1px solid #d0c8b8;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    color: #444;
  }
  .sph-card .btn:hover { background: #f3eedf; }
  .sph-card .btn.primary {
    background: #4a8a5c;
    color: #fff;
    border-color: #3a7a4c;
    font-weight: 600;
    padding: 7px 12px;
    margin-top: 4px;
  }
  .sph-card .btn.primary:hover { background: #3a7a4c; }
  .sph-card .zoom-readout {
    font-size: 12px;
    color: #666;
    font-variant-numeric: tabular-nums;
  }
  .sph-card .hint {
    font-size: 11px;
    color: #888;
    line-height: 1.4;
    padding: 4px 2px 0;
  }
  .sph-card .formula-display {
    grid-column: 1 / -1;
    grid-row: 3;
    text-align: center;
    min-height: 36px;
    padding: 8px 4px 0;
    color: #1a2a4a;
    overflow-x: auto;
  }
  .sph-card .formula-display mjx-container { font-size: 1.1em; }
  .sph-card .chip-math { margin-right: 5px; }
  .sph-card .chip-math mjx-container { font-size: 1em; }

  .sph-card .hint {
    text-align: center;
  }
  /* S̃ label rendered as an HTML overlay positioned in document coords —
     canvas does not handle combining tilde well. */
  .stilde-label {
    position: absolute;
    transform: translate(-50%, -100%);
    pointer-events: none;
    color: #1a2a4a;
    font: italic 600 18px Georgia, "Times New Roman", serif;
    line-height: 1;
    display: none;
    user-select: none;
    z-index: 100;
    text-shadow: 0 0 3px #fffdf6, 0 0 3px #fffdf6, 0 0 3px #fffdf6;
  }

  /* Narrow layout */
  @media (max-width: 900px) {
    .sph-card {
      grid-template-columns: 1fr;
    }
    .sph-card .perception-bar { grid-column: 1; grid-row: auto; }
    .sph-card .perception-bar .chip-group { flex-direction: row; flex-wrap: wrap; }
    .sph-card .perception-bar .chip { text-align: center; }
    .sph-card .main { grid-column: 1; grid-row: auto; }
    .sph-card .controls-col { grid-column: 1; grid-row: auto; }
  }
</style>
</head>
<body>
<div class="sph-card">
  <h2>SPH perception</h2>

  <div class="perception-bar">
    <span class="label">Perception:</span>
    <div class="chip-group" data-group="perception">
      <button class="chip" data-val="rho"        data-tex="\rho">(density)</button>
      <button class="chip" data-val="count"      data-tex="N">(count)</button>
      <button class="chip" data-val="S"          data-tex="\tilde{S}">(smoothing)</button>
      <button class="chip" data-val="grad0S"     data-tex="\nabla_{0} S">(gradient, 0-th)</button>
      <button class="chip active" data-val="grad1S" data-tex="\nabla_{1} S">(gradient, 1-st)</button>
      <button class="chip" data-val="gradRho"    data-tex="\nabla \rho">(density gradient)</button>
      <button class="chip" data-val="M"          data-tex="M">(moment matrix)</button>
      <button class="chip" data-val="none">none</button>
    </div>
  </div>

  <div class="main">
    <canvas id="main-canvas"></canvas>
    <div class="hint">drag = move centre &middot; shift-drag = pan &middot; wheel = zoom</div>
  </div>

  <div class="formula-display" id="formula-display"></div>

  <div class="kernels">
    <div class="kernel-block">
      <div class="kernel-y-label">\(W_\epsilon(r)\)</div>
      <canvas id="kernel-w"></canvas>
      <div class="kernel-x-label">\(|r|\)</div>
    </div>
    <div class="kernel-block">
      <div class="kernel-y-label">\(\|\nabla W_\epsilon(r)\|\)</div>
      <canvas id="kernel-gradw"></canvas>
      <div class="kernel-x-label">\(|r|\)</div>
    </div>
  </div>

  <div class="controls-col">
    <details open>
      <summary>Sliders</summary>
      <div class="folder-body">
        <div class="slider-row">
          <span class="nm">\(N\)</span>
          <input type="range" id="N-slider" min="5" max="100" step="1" value="50">
          <span class="vl" id="N-val">50</span>
        </div>
        <div class="slider-row">
          <span class="nm">\(\epsilon\)</span>
          <input type="range" id="eps-slider" min="0.05" max="1.5" step="0.01" value="0.40">
          <span class="vl" id="eps-val">0.40</span>
        </div>
      </div>
    </details>

    <details open>
      <summary>Initialization</summary>
      <div class="folder-body">
        <div>
          <div class="group-label">Position</div>
          <div class="chip-group" data-group="posInit">
            <button class="chip active" data-val="uniform">Uniform</button>
            <button class="chip" data-val="gaussian">Gaussian</button>
          </div>
        </div>
        <div class="slider-row">
          <span class="nm">\(R\)</span>
          <input type="range" id="R-slider" min="0.1" max="2.0" step="0.01" value="0.80">
          <span class="vl" id="R-val">0.80</span>
        </div>
        <div>
          <div class="group-label">State</div>
          <div class="chip-group" data-group="stateInit">
            <button class="chip" data-val="random">Random</button>
            <button class="chip active" data-val="gradient">Gradient</button>
            <button class="chip" data-val="ring">Ring</button>
          </div>
        </div>
      </div>
    </details>

    <details open>
      <summary>Visualization</summary>
      <div class="folder-body">
        <div>
          <div class="group-label">Background</div>
          <div class="chip-group" data-group="bgMode">
            <button class="chip" data-val="splat">Splat</button>
            <button class="chip active" data-val="circles">Circles</button>
          </div>
        </div>
        <div class="slider-row">
          <span class="nm">\(\sigma\)</span>
          <input type="range" id="sigma-slider" min="0.02" max="0.4" step="0.01" value="0.10">
          <span class="vl" id="sigma-val">0.10</span>
        </div>
      </div>
    </details>

    <details>
      <summary>Viewport</summary>
      <div class="folder-body">
        <button class="btn" id="reset-view-btn">Reset view</button>
        <div class="zoom-readout">zoom: <span id="zoom-val">1.00&times;</span></div>
      </div>
    </details>

    <button class="btn primary" id="reset-all-btn">Reset particles</button>
  </div>
</div>

<div class="stilde-label" id="stilde-label">\(\tilde{S}\)</div>

<script>
(function() {
  'use strict';

  // ============================================================
  // State
  // ============================================================
  const state = {
    particles: [],
    N: 50,
    epsilon: 0.40,
    sigma: 0.10,
    initRange: 0.80,
    posInit: 'uniform',
    stateInit: 'gradient',
    bgMode: 'circles',
    perception: 'grad1S',
    view: { cx: 0, cy: 0, halfSpan: 1.2 },
    rho: null,        // Float64Array, per-particle density
    stateCtx: null,   // closure state for stateInit (e.g., gradient direction)
  };

  const DEFAULT_HALFSPAN = 1.2;
  const DET_TAU = 1e-6;

  // ============================================================
  // Canvas / DPI handling
  // ============================================================
  const mainCanvas = document.getElementById('main-canvas');
  const ctx = mainCanvas.getContext('2d');
  const kWCanvas = document.getElementById('kernel-w');
  const kGCanvas = document.getElementById('kernel-gradw');
  const kWCtx = kWCanvas.getContext('2d');
  const kGCtx = kGCanvas.getContext('2d');

  function fitCanvas(c) {
    const dpr = window.devicePixelRatio || 1;
    const rect = c.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    if (c.width !== w || c.height !== h) {
      c.width = w;
      c.height = h;
      return true;
    }
    return false;
  }

  // ============================================================
  // Coordinate transforms (world <-> pixel)
  // ============================================================
  function viewScalePx() {
    return Math.min(mainCanvas.width, mainCanvas.height) / 2;
  }
  function worldToPx(wx, wy) {
    const s = viewScalePx();
    return [
      mainCanvas.width / 2  + (wx - state.view.cx) / state.view.halfSpan * s,
      mainCanvas.height / 2 + (wy - state.view.cy) / state.view.halfSpan * s,
    ];
  }
  function pxToWorld(px, py) {
    const s = viewScalePx();
    return [
      state.view.cx + (px - mainCanvas.width  / 2) / s * state.view.halfSpan,
      state.view.cy + (py - mainCanvas.height / 2) / s * state.view.halfSpan,
    ];
  }
  function worldSizeToPx(ws) {
    return ws / state.view.halfSpan * viewScalePx();
  }
  function cssToCanvasPx(cssX, cssY) {
    const rect = mainCanvas.getBoundingClientRect();
    return [
      (cssX - rect.left) * (mainCanvas.width  / rect.width),
      (cssY - rect.top)  * (mainCanvas.height / rect.height),
    ];
  }

  // ============================================================
  // SPH kernels
  // ============================================================
  function W(r, eps) {
    if (r >= eps) return 0;
    const c = 4 / (Math.PI * Math.pow(eps, 8));
    const d = eps * eps - r * r;
    return c * d * d * d;
  }
  function gradW(rx, ry, eps) {
    const r = Math.hypot(rx, ry);
    if (r === 0 || r >= eps) return [0, 0];
    const c = 10 / (Math.PI * Math.pow(eps, 5));
    const k = c * (eps - r) * (eps - r) / r;
    return [k * rx, k * ry];
  }
  function gradWNorm(r, eps) {
    if (r === 0 || r >= eps) return 0;
    return 10 / (Math.PI * Math.pow(eps, 5)) * (eps - r) * (eps - r);
  }

  // ============================================================
  // Sampling
  // ============================================================
  function randn() {
    const u = Math.max(1e-9, Math.random()), v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function samplePos(R, mode) {
    if (mode === 'uniform') {
      return [(Math.random() * 2 - 1) * R, (Math.random() * 2 - 1) * R];
    } else if (mode === 'disk') {
      const r = R * Math.sqrt(Math.random());
      const t = Math.random() * 2 * Math.PI;
      return [r * Math.cos(t), r * Math.sin(t)];
    } else { // gaussian
      const sig = R / 2.5;
      let x = randn() * sig, y = randn() * sig;
      x = Math.max(-R, Math.min(R, x));
      y = Math.max(-R, Math.min(R, y));
      return [x, y];
    }
  }
  function hsv2rgb(h, s, v) {
    h = (h % 1 + 1) % 1;
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: return [v, t, p];
      case 1: return [q, v, p];
      case 2: return [p, v, t];
      case 3: return [p, q, v];
      case 4: return [t, p, v];
      default: return [v, p, q];
    }
  }

  function randUnit2D() {
    const a = Math.random() * 2 * Math.PI;
    return [Math.cos(a), Math.sin(a)];
  }
  function randColor() {  // in [-1, 1]^3
    return [Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1];
  }

  function resampleStateCtx() {
    if (state.stateInit === 'gradient') {
      // Independent spatial gradient direction per RGB channel.
      state.stateCtx = { dirs: [randUnit2D(), randUnit2D(), randUnit2D()] };
    } else if (state.stateInit === 'flat-ch') {
      // One RGB channel is identically zero (→ that channel's gradient must be zero
      // and S̃ for that channel stays at 0). The other two channels get independent
      // random spatial gradients.
      state.stateCtx = {
        zeroCh: Math.floor(Math.random() * 3),
        dirs: [randUnit2D(), randUnit2D(), randUnit2D()],
      };
    } else {
      state.stateCtx = null;
    }
  }
  function sampleState(x, y) {
    if (state.stateInit === 'random') {
      return [Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1];
    } else if (state.stateInit === 'gradient') {
      const c = state.stateCtx;
      const invR = 1 / Math.max(1e-9, state.initRange);
      // S_c(p) = d_c · p / R  → roughly in [-√2, √2], then clipped to [-1, 1]
      const clamp = (v) => Math.max(-1, Math.min(1, v));
      return [
        clamp(c.dirs[0][0] * x * invR + c.dirs[0][1] * y * invR),
        clamp(c.dirs[1][0] * x * invR + c.dirs[1][1] * y * invR),
        clamp(c.dirs[2][0] * x * invR + c.dirs[2][1] * y * invR),
      ];
    } else if (state.stateInit === 'ring') {
      const angle = Math.atan2(y, x);
      const h = (angle / (2 * Math.PI) + 1) % 1;
      const [r, g, b] = hsv2rgb(h, 1, 1);
      return [r * 2 - 1, g * 2 - 1, b * 2 - 1];
    } else { // flat-ch
      const c = state.stateCtx;
      const invR = 1 / Math.max(1e-9, state.initRange);
      const clamp = (v) => Math.max(-1, Math.min(1, v));
      const out = [
        clamp(c.dirs[0][0] * x * invR + c.dirs[0][1] * y * invR),
        clamp(c.dirs[1][0] * x * invR + c.dirs[1][1] * y * invR),
        clamp(c.dirs[2][0] * x * invR + c.dirs[2][1] * y * invR),
      ];
      out[c.zeroCh] = 0;
      return out;
    }
  }

  function resample() {
    resampleStateCtx();
    lastEig = null;        // forget M-arrow tracking — new sample, new principal axes
    state.particles = [];
    // Centre particle: fixed at origin with zero state, regardless of init mode.
    state.particles.push({ x: 0, y: 0, r: 0, g: 0, b: 0 });
    for (let i = 1; i < state.N; i++) {
      const [x, y] = samplePos(state.initRange, state.posInit);
      const [r, g, b] = sampleState(x, y);
      state.particles.push({ x, y, r, g, b });
    }
    invalidate();
  }

  // ============================================================
  // SPH operators
  // ============================================================
  function computeAllRho() {
    const N = state.particles.length;
    const rho = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      let s = 0;
      const pi = state.particles[i];
      for (let j = 0; j < N; j++) {
        const pj = state.particles[j];
        const r = Math.hypot(pi.x - pj.x, pi.y - pj.y);
        s += W(r, state.epsilon);
      }
      rho[i] = s;
    }
    state.rho = rho;
  }

  function computeCentreOps() {
    const N = state.particles.length;
    const pi = state.particles[0];
    let rho = 0;
    let count = 0;
    let Sr = 0, Sg = 0, Sb = 0;
    let grx = 0, gry = 0;
    let m00 = 0, m01 = 0, m10 = 0, m11 = 0;
    let g00 = 0, g01 = 0, g10 = 0, g11 = 0, g20 = 0, g21 = 0;
    const Si = [pi.r, pi.g, pi.b];
    for (let j = 0; j < N; j++) {
      const pj = state.particles[j];
      // r_ji = x_j - x_i  →  ∇W(r_ji) points from i toward j,
      // so ∇ρ accumulates toward denser regions (mathematical gradient convention).
      const rx = pj.x - pi.x;
      const ry = pj.y - pi.y;
      const rmag = Math.hypot(rx, ry);
      const w = W(rmag, state.epsilon);
      const [gx, gy] = gradW(rx, ry, state.epsilon);
      rho += w;
      if (rmag < state.epsilon) count++;  // neighbour count incl. self (rmag=0)
      grx += gx;
      gry += gy;
      const rj = state.rho[j];
      const invRho = rj > 1e-9 ? 1 / rj : 0;
      Sr += pj.r * w * invRho;
      Sg += pj.g * w * invRho;
      Sb += pj.b * w * invRho;
      m00 += rx * gx * invRho;
      m01 += rx * gy * invRho;
      m10 += ry * gx * invRho;
      m11 += ry * gy * invRho;
      const dr = pj.r - Si[0], dg = pj.g - Si[1], db = pj.b - Si[2];
      g00 += dr * gx * invRho;
      g01 += dr * gy * invRho;
      g10 += dg * gx * invRho;
      g11 += dg * gy * invRho;
      g20 += db * gx * invRho;
      g21 += db * gy * invRho;
    }
    const M = [[m00, m01], [m10, m11]];
    const grad0S = [[g00, g01], [g10, g11], [g20, g21]];
    // grad1S = grad0S * M^-1  (per row, since each channel's grad is a 1x2 row vector)
    const det = m00 * m11 - m01 * m10;
    let grad1S;
    if (Math.abs(det) >= DET_TAU) {
      const im00 =  m11 / det, im01 = -m01 / det;
      const im10 = -m10 / det, im11 =  m00 / det;
      grad1S = [
        [g00 * im00 + g01 * im10, g00 * im01 + g01 * im11],
        [g10 * im00 + g11 * im10, g10 * im01 + g11 * im11],
        [g20 * im00 + g21 * im10, g20 * im01 + g21 * im11],
      ];
    } else {
      grad1S = grad0S; // M ≈ I fallback
    }
    return { rho, count, S: [Sr, Sg, Sb], gradRho: [grx, gry], M, grad0S, grad1S };
  }

  function eig2x2(M) {
    const a = M[0][0], b = M[0][1], c = M[1][0], d = M[1][1];
    const T = a + d;
    const D = a * d - b * c;
    const disc = Math.max(0, T * T / 4 - D);
    const sq = Math.sqrt(disc);
    const l1 = T / 2 + sq, l2 = T / 2 - sq;
    function v(lam) {
      let vx, vy;
      if (Math.abs(b) > 1e-9) { vx = b; vy = lam - a; }
      else if (Math.abs(c) > 1e-9) { vx = lam - d; vy = c; }
      else {
        if (Math.abs(lam - a) < Math.abs(lam - d)) { vx = 1; vy = 0; }
        else { vx = 0; vy = 1; }
      }
      const n = Math.hypot(vx, vy) || 1;
      return [vx / n, vy / n];
    }
    return { v1: v(l1), l1, v2: v(l2), l2 };
  }

  // Temporal eigenvector tracking: pick the (v1, v2) assignment + signs that
  // best match the previous frame's eigenvectors, so the arrows don't flip on
  // small movements past degeneracies / eigenvalue swaps.
  // Reset to null on resample so a fresh sample doesn't inherit stale state.
  let lastEig = null;
  function stabilizeEig(curr) {
    const signMatch = (vNew, vOld) => {
      const dot = vNew[0] * vOld[0] + vNew[1] * vOld[1];
      return dot >= 0 ? vNew : [-vNew[0], -vNew[1]];
    };
    const absDot = (a, b) => Math.abs(a[0] * b[0] + a[1] * b[1]);

    if (!lastEig) {
      lastEig = { v1: curr.v1.slice(), l1: curr.l1, v2: curr.v2.slice(), l2: curr.l2 };
      return curr;
    }
    // Try (v1↔v1, v2↔v2) vs (v1↔v2, v2↔v1) — pick assignment with higher total
    // |dot|; for the chosen assignment, flip signs to align with previous.
    const direct  = absDot(curr.v1, lastEig.v1) + absDot(curr.v2, lastEig.v2);
    const swapped = absDot(curr.v1, lastEig.v2) + absDot(curr.v2, lastEig.v1);
    let out;
    if (direct >= swapped) {
      out = {
        v1: signMatch(curr.v1, lastEig.v1), l1: curr.l1,
        v2: signMatch(curr.v2, lastEig.v2), l2: curr.l2,
      };
    } else {
      out = {
        v1: signMatch(curr.v2, lastEig.v1), l1: curr.l2,
        v2: signMatch(curr.v1, lastEig.v2), l2: curr.l1,
      };
    }
    lastEig = { v1: out.v1.slice(), l1: out.l1, v2: out.v2.slice(), l2: out.l2 };
    return out;
  }

  // ============================================================
  // Drawing helpers
  // ============================================================
  function drawArrow(px1, py1, px2, py2, color, lineWidth) {
    if (px1 === px2 && py1 === py2) return;
    const head = Math.max(12, lineWidth * 5);
    const halfAng = 0.45;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Pull shaft endpoint back so the arrowhead's flat back aligns with the tip.
    const ang = Math.atan2(py2 - py1, px2 - px1);
    const backOff = head * Math.cos(halfAng) * 0.85;
    const sx = px2 - backOff * Math.cos(ang);
    const sy = py2 - backOff * Math.sin(ang);
    ctx.beginPath();
    ctx.moveTo(px1, py1);
    ctx.lineTo(sx, sy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px2, py2);
    ctx.lineTo(px2 - head * Math.cos(ang - halfAng), py2 - head * Math.sin(ang - halfAng));
    ctx.lineTo(px2 - head * Math.cos(ang + halfAng), py2 - head * Math.sin(ang + halfAng));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  function rgbStr(r, g, b, a) {
    const cl = v => Math.max(0, Math.min(255, Math.round(v * 255)));
    if (a === undefined) return `rgb(${cl(r)},${cl(g)},${cl(b)})`;
    return `rgba(${cl(r)},${cl(g)},${cl(b)},${a})`;
  }
  // State values live in [-1, 1]; map to [0, 1] for canvas colours.
  function s2c(v) { return Math.max(0, Math.min(1, (v + 1) * 0.5)); }

  // S̃ label rendered as an HTML overlay positioned in document coords —
  // the browser's text engine handles the combining tilde cleanly, unlike canvas.
  const stildeLabel = document.getElementById('stilde-label');
  function positionStildeLabel(cx_canvas, cy_canvas) {
    if (state.perception !== 'S') {
      stildeLabel.style.display = 'none';
      return;
    }
    const rect = mainCanvas.getBoundingClientRect();
    const scaleX = rect.width  / mainCanvas.width;
    const scaleY = rect.height / mainCanvas.height;
    const x = rect.left + window.scrollX + cx_canvas * scaleX;
    const y = rect.top  + window.scrollY + (cy_canvas - 16) * scaleY;
    stildeLabel.style.left = x + 'px';
    stildeLabel.style.top  = y + 'px';
    stildeLabel.style.display = 'inline-block';
  }

  // ============================================================
  // Background renderers
  // ============================================================
  // Splat is expensive; rendered to a low-res offscreen and scaled up.
  const splatOff = document.createElement('canvas');
  const splatOffCtx = splatOff.getContext('2d');
  const SPLAT_RES = 220;  // long-side pixels at low-res

  function drawSplatBackground() {
    const W_ = mainCanvas.width, H_ = mainCanvas.height;
    const aspect = W_ / H_;
    let lrW, lrH;
    if (aspect >= 1) { lrW = SPLAT_RES; lrH = Math.round(SPLAT_RES / aspect); }
    else             { lrH = SPLAT_RES; lrW = Math.round(SPLAT_RES * aspect); }
    splatOff.width = lrW;
    splatOff.height = lrH;
    const img = splatOffCtx.createImageData(lrW, lrH);
    const data = img.data;
    const accR = new Float32Array(lrW * lrH);
    const accG = new Float32Array(lrW * lrH);
    const accB = new Float32Array(lrW * lrH);
    const accW = new Float32Array(lrW * lrH);

    const scale = lrW / W_;
    const sigmaPxLo = worldSizeToPx(state.sigma) * scale;
    const radius = Math.max(2, Math.ceil(sigmaPxLo * 3));
    const invTwoSig2 = 1 / (2 * sigmaPxLo * sigmaPxLo);

    for (const p of state.particles) {
      const [cxH, cyH] = worldToPx(p.x, p.y);
      const cx = cxH * scale, cy = cyH * scale;
      const x0 = Math.max(0, Math.floor(cx - radius));
      const x1 = Math.min(lrW, Math.ceil(cx + radius) + 1);
      const y0 = Math.max(0, Math.floor(cy - radius));
      const y1 = Math.min(lrH, Math.ceil(cy + radius) + 1);
      const pr = s2c(p.r), pg = s2c(p.g), pb = s2c(p.b);
      for (let y = y0; y < y1; y++) {
        const dy = y - cy;
        for (let x = x0; x < x1; x++) {
          const dx = x - cx;
          const w = Math.exp(-(dx * dx + dy * dy) * invTwoSig2);
          if (w < 1e-3) continue;
          const idx = y * lrW + x;
          accR[idx] += w * pr;
          accG[idx] += w * pg;
          accB[idx] += w * pb;
          accW[idx] += w;
        }
      }
    }

    const bgR = 0xff, bgG = 0xfd, bgB = 0xf6;
    for (let i = 0; i < lrW * lrH; i++) {
      const i4 = i * 4;
      const w = accW[i];
      if (w > 1e-6) {
        const a = 1 - Math.exp(-w * 1.4);
        const rr = accR[i] / w, gg = accG[i] / w, bb = accB[i] / w;
        // pre-composite over cream
        data[i4]     = Math.round(rr * 255 * a + bgR * (1 - a));
        data[i4 + 1] = Math.round(gg * 255 * a + bgG * (1 - a));
        data[i4 + 2] = Math.round(bb * 255 * a + bgB * (1 - a));
      } else {
        data[i4]     = bgR;
        data[i4 + 1] = bgG;
        data[i4 + 2] = bgB;
      }
      data[i4 + 3] = 255;
    }
    splatOffCtx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(splatOff, 0, 0, W_, H_);
  }

  function drawCirclesBackground() {
    // Background is just the cream; circles are drawn with particles
  }

  // ============================================================
  // Main render
  // ============================================================
  let pendingFrame = false;
  function invalidate() {
    if (pendingFrame) return;
    pendingFrame = true;
    requestAnimationFrame(() => {
      pendingFrame = false;
      render();
    });
  }

  function render() {
    fitCanvas(mainCanvas);
    fitCanvas(kWCanvas);
    fitCanvas(kGCanvas);

    const W_ = mainCanvas.width, H_ = mainCanvas.height;

    // Background
    ctx.fillStyle = '#fffdf6';
    ctx.fillRect(0, 0, W_, H_);

    computeAllRho();

    if (state.bgMode === 'splat') {
      drawSplatBackground();
    }

    // Perception radius ring
    const [ccx, ccy] = worldToPx(state.particles[0].x, state.particles[0].y);
    const epsPx = worldSizeToPx(state.epsilon);
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(60, 60, 60, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ccx, ccy, epsPx, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.restore();

    // Particles (circles)
    const sigmaPxWorld = worldSizeToPx(state.sigma);
    const circleRadiusPx = state.bgMode === 'circles'
      ? Math.max(3, sigmaPxWorld * 0.4)
      : Math.max(3, Math.min(8, sigmaPxWorld * 0.15 + 3));
    for (let i = 1; i < state.particles.length; i++) {
      const p = state.particles[i];
      const [px, py] = worldToPx(p.x, p.y);
      ctx.fillStyle = rgbStr(s2c(p.r), s2c(p.g), s2c(p.b));
      ctx.beginPath();
      ctx.arc(px, py, circleRadiusPx, 0, 2 * Math.PI);
      ctx.fill();
      ctx.lineWidth = 0.8;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.stroke();
    }

    // Centre particle (highlighted)
    const p0 = state.particles[0];
    const centreR = Math.max(circleRadiusPx, 7);
    ctx.fillStyle = rgbStr(s2c(p0.r), s2c(p0.g), s2c(p0.b));
    ctx.beginPath();
    ctx.arc(ccx, ccy, centreR, 0, 2 * Math.PI);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#1a2a4a';
    ctx.stroke();
    ctx.fillStyle = '#1a2a4a';
    ctx.beginPath();
    ctx.arc(ccx, ccy, 2, 0, 2 * Math.PI);
    ctx.fill();

    // Perception overlay
    const ops = computeCentreOps();
    drawPerceptionOverlay(ccx, ccy, ops);
    positionStildeLabel(ccx, ccy);

    // Kernel mini-plots
    drawKernelPlots();
  }

  function drawPerceptionOverlay(cx, cy, ops) {
    const mode = state.perception;
    if (mode === 'none') return;
    const arrowScale = worldSizeToPx(state.epsilon) * 1.4; // visual scale
    // Reference unit: target maximum arrow length ~ epsilon ring
    // We normalize each quantity by its own typical magnitude.

    if (mode === 'rho') {
      ctx.save();
      ctx.font = '12px ui-monospace, Menlo, monospace';
      ctx.fillStyle = '#1a2a4a';
      ctx.textBaseline = 'middle';
      ctx.fillText('ρ = ' + ops.rho.toFixed(3), cx + 14, cy - 14);
      ctx.restore();
    } else if (mode === 'count') {
      ctx.save();
      ctx.font = '12px ui-monospace, Menlo, monospace';
      ctx.fillStyle = '#1a2a4a';
      ctx.textBaseline = 'middle';
      ctx.fillText('N = ' + ops.count, cx + 14, cy - 14);
      ctx.restore();
    } else if (mode === 'S') {
      // Swatch above the centre — S̃ label is rendered separately as an HTML
      // overlay (see positionStildeLabel) for crisp combining-tilde typography.
      ctx.save();
      const sz = 24;
      ctx.fillStyle = rgbStr(s2c(ops.S[0]), s2c(ops.S[1]), s2c(ops.S[2]));
      ctx.fillRect(cx - sz / 2, cy - 38, sz, sz);
      ctx.strokeStyle = '#1a2a4a';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(cx - sz / 2, cy - 38, sz, sz);
      ctx.restore();
    } else if (mode === 'gradRho') {
      const [gx, gy] = ops.gradRho;
      const mag = Math.hypot(gx, gy);
      if (mag > 1e-9) {
        const norm = arrowScale / Math.max(mag, 1);
        const ax = cx + gx * norm * 0.4;
        const ay = cy + gy * norm * 0.4;
        drawArrow(cx, cy, ax, ay, '#222', 2.5);
        ctx.save();
        ctx.font = '11px ui-monospace, Menlo, monospace';
        ctx.fillStyle = '#222';
        ctx.fillText('∇ρ', ax + 4, ay - 4);
        ctx.restore();
      }
    } else if (mode === 'grad0S' || mode === 'grad1S') {
      const g = mode === 'grad0S' ? ops.grad0S : ops.grad1S;
      const colors = ['#d23a3a', '#2a9d2a', '#2a6ad2'];
      const labels = ['R', 'G', 'B'];
      // Find max magnitude across the 3 channel vectors to share a scale
      let maxMag = 0;
      for (let c = 0; c < 3; c++) {
        const mg = Math.hypot(g[c][0], g[c][1]);
        if (mg > maxMag) maxMag = mg;
      }
      if (maxMag < 1e-9) maxMag = 1;
      const norm = arrowScale / maxMag * 0.8;
      for (let c = 0; c < 3; c++) {
        const ax = cx + g[c][0] * norm;
        const ay = cy + g[c][1] * norm;
        drawArrow(cx, cy, ax, ay, colors[c], 2.2);
      }
      ctx.save();
      ctx.font = '10px ui-monospace, Menlo, monospace';
      ctx.fillStyle = '#444';
      ctx.fillText((mode === 'grad0S' ? '∇₀S' : '∇₁S'), cx + 12, cy + 14);
      ctx.restore();
    } else if (mode === 'M') {
      const { v1, l1, v2, l2 } = stabilizeEig(eig2x2(ops.M));
      // length proportional to eigenvalue magnitude
      const maxLam = Math.max(Math.abs(l1), Math.abs(l2), 1e-9);
      const norm = arrowScale / maxLam * 0.8;
      const a1x = cx + v1[0] * l1 * norm;
      const a1y = cy + v1[1] * l1 * norm;
      const a2x = cx + v2[0] * l2 * norm;
      const a2y = cy + v2[1] * l2 * norm;
      drawArrow(cx, cy, a1x, a1y, '#111', 2.3);
      drawArrow(cx, cy, a2x, a2y, '#111', 2.3);
      ctx.save();
      ctx.font = '10px ui-monospace, Menlo, monospace';
      ctx.fillStyle = '#444';
      ctx.fillText('M eig', cx + 12, cy + 14);
      ctx.restore();
    }
  }

  // ============================================================
  // Kernel mini-plots
  // ============================================================
  function drawKernelOnto(canvas, c, fn, yLabel) {
    const W_ = canvas.width, H_ = canvas.height;
    c.clearRect(0, 0, W_, H_);
    c.fillStyle = '#fffdf6';
    c.fillRect(0, 0, W_, H_);
    const dpr = window.devicePixelRatio || 1;
    const fs = 13 * dpr;         // axis-label font size
    // Margins: extra top for the horizontal y-label sitting above the y axis,
    // extra left for the y-axis line + arrow, extra bottom for the x-label.
    const padL = 18 * dpr;
    const padR = 24 * dpr;
    const padT = 36 * dpr;     // room for y-axis extension + horizontal y-label
    const padB = 28 * dpr;
    const eps = state.epsilon;
    const xMax = eps * 1.2;
    const N = 80;
    let maxY = 0;
    const samples = [];
    for (let i = 0; i <= N; i++) {
      const r = (i / N) * xMax;
      const y = fn(r);
      samples.push([r, y]);
      if (y > maxY) maxY = y;
    }
    if (maxY < 1e-12) maxY = 1;
    const x0 = padL, x1 = W_ - padR;
    const y0 = padT, y1 = H_ - padB;
    const rToPx = (r) => x0 + (r / xMax) * (x1 - x0);

    // Axes with arrowheads (light grey so they recede behind the curve)
    const axisColor = '#bdb6a4';
    const axisW = 1 * dpr;
    const ah = 6 * dpr;       // arrowhead length
    const aw = 3.2 * dpr;     // arrowhead half-width
    c.strokeStyle = axisColor;
    c.fillStyle = axisColor;
    c.lineWidth = axisW;
    c.lineCap = 'butt';
    // x axis: from origin (x0, y1) extending right past x1 with arrow
    const xTipX = x1 + ah * 1.5;
    c.beginPath();
    c.moveTo(x0, y1); c.lineTo(xTipX, y1);
    c.stroke();
    c.beginPath();
    c.moveTo(xTipX, y1);
    c.lineTo(xTipX - ah, y1 - aw);
    c.lineTo(xTipX - ah, y1 + aw);
    c.closePath();
    c.fill();
    // y axis: from origin (x0, y1) extending well past the plot top, with arrow
    const yTipY = y0 - ah * 3;
    c.beginPath();
    c.moveTo(x0, y1); c.lineTo(x0, yTipY);
    c.stroke();
    c.beginPath();
    c.moveTo(x0, yTipY);
    c.lineTo(x0 - aw, yTipY + ah);
    c.lineTo(x0 + aw, yTipY + ah);
    c.closePath();
    c.fill();

    // Dashed vertical guide at r = ε
    c.save();
    c.strokeStyle = 'rgba(80, 80, 80, 0.45)';
    c.setLineDash([3 * dpr, 3 * dpr]);
    c.lineWidth = 1 * dpr;
    c.beginPath();
    c.moveTo(rToPx(eps), y0);
    c.lineTo(rToPx(eps), y1);
    c.stroke();
    c.restore();

    // Curve
    c.strokeStyle = '#111';
    c.lineWidth = 2 * dpr;
    c.beginPath();
    for (let i = 0; i < samples.length; i++) {
      const [r, y] = samples[i];
      const px = rToPx(r);
      const py = y1 - (y / maxY) * (y1 - y0);
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.stroke();

    // Neighbour distance markers
    if (state.particles.length) {
      const p0 = state.particles[0];
      for (let i = 1; i < state.particles.length; i++) {
        const pj = state.particles[i];
        const r = Math.hypot(p0.x - pj.x, p0.y - pj.y);
        if (r >= xMax) continue;
        const y = fn(r);
        const px = rToPx(r);
        const py = y1 - (y / maxY) * (y1 - y0);
        c.fillStyle = rgbStr(s2c(pj.r), s2c(pj.g), s2c(pj.b));
        c.beginPath();
        c.arc(px, py, 4 * dpr, 0, 2 * Math.PI);
        c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.4)';
        c.lineWidth = 0.8 * dpr;
        c.stroke();
      }
    }

    // X-axis tick labels: "0" and "ε"
    c.fillStyle = '#444';
    c.font = `${fs}px ui-monospace, Menlo, monospace`;
    c.textBaseline = 'top';
    c.textAlign = 'center';
    c.fillText('0', x0, y1 + 4 * dpr);
    c.fillText('ε', rToPx(eps), y1 + 4 * dpr);

    // X- and Y-axis labels are HTML overlays positioned over the kernel-block
    // so MathJax can typeset them (see .kernel-x-label / .kernel-y-label).
  }
  function drawKernelPlots() {
    drawKernelOnto(kWCanvas, kWCtx, (r) => W(r, state.epsilon), 'Wε(r)');
    drawKernelOnto(kGCanvas, kGCtx, (r) => gradWNorm(r, state.epsilon), '‖∇Wε(r)‖');
  }

  // ============================================================
  // Controls
  // ============================================================
  function setupSlider(id, valId, key, decimals, opts) {
    const el = document.getElementById(id);
    const vl = document.getElementById(valId);
    const resample_ = (opts && opts.resample) === true;
    function update() {
      const v = parseFloat(el.value);
      state[key] = v;
      vl.textContent = decimals === 0 ? String(Math.round(v)) : v.toFixed(decimals);
      if (resample_) resample(); else invalidate();
    }
    el.addEventListener('input', update);
    return update;
  }
  setupSlider('N-slider', 'N-val', 'N', 0, { resample: true });
  setupSlider('eps-slider', 'eps-val', 'epsilon', 2);
  setupSlider('R-slider', 'R-val', 'initRange', 2, { resample: true });
  setupSlider('sigma-slider', 'sigma-val', 'sigma', 2);

  function setupChipGroup(groupName, key, opts) {
    const container = document.querySelector(`.chip-group[data-group="${groupName}"]`);
    if (!container) return;
    const resample_ = (opts && opts.resample) === true;
    const onPick = (opts && opts.onPick) || null;
    container.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state[key] = btn.dataset.val;
        if (onPick) onPick();
        if (resample_) resample(); else invalidate();
      });
    });
  }
  setupChipGroup('perception', 'perception', { onPick: updateFormulaDisplay });
  setupChipGroup('bgMode', 'bgMode');
  setupChipGroup('posInit', 'posInit', { resample: true });
  setupChipGroup('stateInit', 'stateInit', { resample: true });

  // ============================================================
  // Math typesetting (MathJax 3)
  // ============================================================
  function mjTypeset(elements) {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise(elements).catch(() => {});
    } else {
      // MathJax is async-loaded; try again shortly.
      setTimeout(() => mjTypeset(elements), 120);
    }
  }

  // Inject a math span at the start of each chip that has data-tex.
  document.querySelectorAll('.chip[data-tex]').forEach(btn => {
    const tex = btn.dataset.tex;
    const trailing = btn.textContent;
    btn.textContent = '';
    const math = document.createElement('span');
    math.className = 'chip-math';
    math.textContent = `\\(${tex}\\)`;
    btn.appendChild(math);
    btn.appendChild(document.createTextNode(' ' + trailing));
  });

  const PERCEPTION_FORMULAS = {
    rho:     '\\rho_i \\;=\\; \\sum_j m_j \\, W_\\epsilon(\\mathbf{r}_{ji})',
    count:   'N_i \\;=\\; \\Bigl|\\{\\, j : \\|\\mathbf{r}_{ji}\\| < \\epsilon \\,\\}\\Bigr|',
    S:       '\\tilde{\\mathbf{S}}_i \\;=\\; \\sum_j \\frac{m_j}{\\rho_j}\\, \\mathbf{S}_j \\, W_\\epsilon(\\mathbf{r}_{ji})',
    grad0S:  '\\nabla_{0}\\mathbf{S}_i \\;=\\; \\sum_j \\frac{m_j}{\\rho_j}\\, (\\mathbf{S}_j - \\mathbf{S}_i)\\, \\nabla W_\\epsilon(\\mathbf{r}_{ji})^{\\!\\top}',
    grad1S:  '\\nabla_{1}\\mathbf{S}_i \\;=\\; \\mathbf{M}_i^{-1}\\, \\nabla_{0}\\mathbf{S}_i',
    gradRho: '\\nabla \\rho_i \\;=\\; \\sum_j m_j \\, \\nabla W_\\epsilon(\\mathbf{r}_{ji})',
    M:       '\\mathbf{M}_i \\;=\\; \\sum_j \\frac{m_j}{\\rho_j}\\, \\mathbf{r}_{ji}\\, \\nabla W_\\epsilon(\\mathbf{r}_{ji})^{\\!\\top}',
  };
  const formulaEl = document.getElementById('formula-display');
  function updateFormulaDisplay() {
    const tex = PERCEPTION_FORMULAS[state.perception];
    if (!tex) { formulaEl.textContent = ''; return; }
    formulaEl.innerHTML = `\\[ ${tex} \\]`;
    mjTypeset([formulaEl]);
  }
  // Initial typeset for chips, stilde label, and the starting formula.
  updateFormulaDisplay();
  mjTypeset();

  document.getElementById('reset-all-btn').addEventListener('click', () => {
    state.particles[0] && (state.particles[0].x = 0, state.particles[0].y = 0);
    resample();
  });
  document.getElementById('reset-view-btn').addEventListener('click', () => {
    state.view = { cx: 0, cy: 0, halfSpan: DEFAULT_HALFSPAN };
    document.getElementById('zoom-val').textContent =
      (DEFAULT_HALFSPAN / state.view.halfSpan).toFixed(2) + '×';
    invalidate();
  });

  // ============================================================
  // Mouse / touch interactions on main canvas
  // ============================================================
  let drag = null;  // {kind: 'centre'|'pan', lastPx, lastPy}

  function onPointerDown(e) {
    e.preventDefault();
    mainCanvas.setPointerCapture(e.pointerId);
    const [px, py] = cssToCanvasPx(e.clientX, e.clientY);
    if (e.shiftKey) {
      drag = { kind: 'pan', lastPx: px, lastPy: py };
    } else {
      drag = { kind: 'centre' };
      const [wx, wy] = pxToWorld(px, py);
      state.particles[0].x = wx;
      state.particles[0].y = wy;
      invalidate();
    }
    mainCanvas.classList.add('dragging');
  }
  function onPointerMove(e) {
    if (!drag) return;
    const [px, py] = cssToCanvasPx(e.clientX, e.clientY);
    if (drag.kind === 'centre') {
      const [wx, wy] = pxToWorld(px, py);
      state.particles[0].x = wx;
      state.particles[0].y = wy;
      invalidate();
    } else if (drag.kind === 'pan') {
      const s = viewScalePx();
      const dxW = (px - drag.lastPx) / s * state.view.halfSpan;
      const dyW = (py - drag.lastPy) / s * state.view.halfSpan;
      state.view.cx -= dxW;
      state.view.cy -= dyW;
      drag.lastPx = px; drag.lastPy = py;
      invalidate();
    }
  }
  function onPointerUp(e) {
    drag = null;
    mainCanvas.classList.remove('dragging');
    try { mainCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  mainCanvas.addEventListener('pointerdown', onPointerDown);
  mainCanvas.addEventListener('pointermove', onPointerMove);
  mainCanvas.addEventListener('pointerup', onPointerUp);
  mainCanvas.addEventListener('pointercancel', onPointerUp);

  mainCanvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    // Continuous zoom intensity based on wheel delta (trackpad-friendly).
    // Clamp deltaY to avoid huge jumps from chunky scroll wheels.
    const dy = Math.max(-120, Math.min(120, e.deltaY));
    const factor = Math.exp(dy * 0.0015);
    const oldSpan = state.view.halfSpan;
    const newSpan = Math.max(0.05, Math.min(20, oldSpan * factor));
    // Anchor zoom on the centre particle: keep it at the same screen position.
    const p0 = state.particles[0];
    state.view.cx = p0.x - (p0.x - state.view.cx) * (newSpan / oldSpan);
    state.view.cy = p0.y - (p0.y - state.view.cy) * (newSpan / oldSpan);
    state.view.halfSpan = newSpan;
    document.getElementById('zoom-val').textContent =
      (DEFAULT_HALFSPAN / state.view.halfSpan).toFixed(2) + '×';
    invalidate();
  }, { passive: false });

  window.addEventListener('resize', () => invalidate());
  window.addEventListener('scroll', () => invalidate(), { passive: true });

  // ============================================================
  // Boot
  // ============================================================
  resample();
  // Re-render once layout settles (so canvas has its CSS size)
  requestAnimationFrame(() => invalidate());
})();
</script>
</body>
</html>
